version: '3.8'
services:
  db:
    image: postgres:17.4
    ports:
      - "5433:5432"
    volumes:
      - ./tmp/db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cfpdb
    networks:
      - app-network
  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    networks:
      - app-network
  app:
    image: cfp-rails-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - app-network
    depends_on:
      - db
      - sidekiq
  
  sidekiq:
    image: cfp-rails-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: bundle exec sidekiq
    volumes:
      - ./app:/app
    env_file:
      - .env
    networks:
      - app-network
    depends_on:
      - db
      - redis

networks:
  app-network:
    driver: bridge